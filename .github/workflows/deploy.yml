name: Deploy EcoMed

# Dispara em cada push para master que altere código do app
on:
  push:
    branches: [master]
    paths-ignore:
      - "*.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  # ── Job 1: qualidade, segurança e builds ─────────────────────────────────
  test:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test --run
        env:
          NODE_ENV: test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Python tests
        run: |
          python -m pip install -r ia/requirements.txt
          python -m pip install -r ia/requirements-dev.txt
          python -m pytest ia/tests

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          AUTH_SECRET: ci-auth-secret-with-at-least-thirty-two-characters
          QR_HMAC_SECRET: ci-qr-secret-with-at-least-thirty-two-characters
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci

      - name: Dependency audit (review signal)
        continue-on-error: true
        run: pnpm audit --audit-level high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 2: Deploy no VPS (só roda se testes passarem) ────────────────────
  deploy:
    name: Deploy → VPS
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Build & Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 18m
          script: |
            set -e
            exec 9>/var/lock/ecomed-deploy.lock
            flock -n 9 || { echo "Outro deploy está em andamento"; exit 1; }
            cd /opt/ecomed

            echo "📥 Selecionando commit imutável..."
            git fetch origin "${{ github.sha }}"
            git checkout --detach "${{ github.sha }}"

            set -a; source /opt/ecomed/.env; set +a

            MIGRATION_URL="${DIRECT_URL:-$DATABASE_URL}"

            echo "🔨 Build estágio 'builder' (com cache; usado para migrar e gerar runner)..."
            # Segredos via BuildKit secrets — não ficam gravados nas camadas da imagem
            docker build \
              --target builder \
              --secret "id=DATABASE_URL,env=DATABASE_URL" \
              --secret "id=AUTH_SECRET,env=AUTH_SECRET" \
              --secret "id=QR_HMAC_SECRET,env=QR_HMAC_SECRET" \
              --secret "id=GOOGLE_CLIENT_SECRET,env=GOOGLE_CLIENT_SECRET" \
              --build-arg "AUTH_URL=${AUTH_URL}" \
              --build-arg "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
              --build-arg "NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}" \
              --build-arg "NEXT_PUBLIC_SANITY_PROJECT_ID=${NEXT_PUBLIC_SANITY_PROJECT_ID:-q9uk6qff}" \
              --build-arg "NEXT_PUBLIC_SANITY_DATASET=${NEXT_PUBLIC_SANITY_DATASET:-production}" \
              -t "ecomed-builder:${{ github.sha }}" .

            echo "🗃️  Aplicando migrações Prisma (prisma migrate deploy)..."
            docker run --rm \
              -e DATABASE_URL="${MIGRATION_URL}" \
              -e DIRECT_URL="${MIGRATION_URL}" \
              "ecomed-builder:${{ github.sha }}" \
              pnpm exec prisma migrate deploy

            echo "♻️  Sincronizando scripts de manutenção..."
            mkdir -p /opt/ecomed/scripts/maintenance
            install -m 0755 ops/maintenance/healthcheck.sh   /opt/ecomed/scripts/maintenance/healthcheck.sh
            install -m 0755 ops/maintenance/cron-missoes.sh  /opt/ecomed/scripts/maintenance/cron-missoes.sh
            install -m 0755 ops/maintenance/backup-db.sh     /opt/ecomed/scripts/maintenance/backup-db.sh

            # Garante crons (idempotentes)
            current_cron=$(crontab -l 2>/dev/null || true)
            new_cron="$current_cron"
            if ! echo "$current_cron" | grep -q '/opt/ecomed/scripts/maintenance/healthcheck.sh'; then
              new_cron="$new_cron"$'\n'"*/2 * * * * /opt/ecomed/scripts/maintenance/healthcheck.sh"
              echo "✅ Cron healthcheck adicionado"
            fi
            if ! echo "$current_cron" | grep -q 'cron-missoes.sh reset'; then
              new_cron="$new_cron"$'\n'"0 3 * * * /opt/ecomed/scripts/maintenance/cron-missoes.sh reset"
              echo "✅ Cron reset-missoes adicionado"
            fi
            if ! echo "$current_cron" | grep -q 'cron-missoes.sh ensure'; then
              new_cron="$new_cron"$'\n'"15 3 * * * /opt/ecomed/scripts/maintenance/cron-missoes.sh ensure"
              echo "✅ Cron ensure-missoes adicionado"
            fi
            if ! echo "$current_cron" | grep -q 'backup-db.sh'; then
              new_cron="$new_cron"$'\n'"30 2 * * * /opt/ecomed/scripts/maintenance/backup-db.sh >> /var/log/ecomed-backup.log 2>&1"
              echo "✅ Cron backup-db adicionado (02:30 diário)"
            fi
            if ! echo "$current_cron" | grep -q 'cron-missoes.sh views'; then
              new_cron="$new_cron"$'\n'"45 3 * * * /opt/ecomed/scripts/maintenance/cron-missoes.sh views"
              echo "✅ Cron aggregate-views adicionado (03:45 diário)"
            fi
            if [ "$new_cron" != "$current_cron" ]; then
              printf '%s\n' "$new_cron" | sed '/^$/d' | crontab -
            fi

            echo "🔨 Build runner final (reaproveita cache do builder)..."
            docker build \
              --secret "id=DATABASE_URL,env=DATABASE_URL" \
              --secret "id=AUTH_SECRET,env=AUTH_SECRET" \
              --secret "id=QR_HMAC_SECRET,env=QR_HMAC_SECRET" \
              --secret "id=GOOGLE_CLIENT_SECRET,env=GOOGLE_CLIENT_SECRET" \
              --build-arg "AUTH_URL=${AUTH_URL}" \
              --build-arg "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
              --build-arg "NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}" \
              --build-arg "NEXT_PUBLIC_SANITY_PROJECT_ID=${NEXT_PUBLIC_SANITY_PROJECT_ID:-q9uk6qff}" \
              --build-arg "NEXT_PUBLIC_SANITY_DATASET=${NEXT_PUBLIC_SANITY_DATASET:-production}" \
              -t "ecomed-app:${{ github.sha }}" .

            echo "🔄 Reiniciando container ecomed-web..."
            docker image inspect ecomed-app:current >/dev/null 2>&1 \
              && docker image tag ecomed-app:current ecomed-app:previous || true
            docker stop ecomed-web 2>/dev/null || true
            docker rm   ecomed-web 2>/dev/null || true
            docker run -d \
              --name ecomed-web \
              --restart unless-stopped \
              --network ia_default \
              -p 3010:3010 \
              --env-file /opt/ecomed/.env \
              "ecomed-app:${{ github.sha }}"

            echo "⏳ Aguardando healthcheck..."
            healthy=false
            for i in $(seq 1 20); do
              status=$(docker inspect ecomed-web --format '{{.State.Health.Status}}' 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then
                echo "✅ Container saudável"
                healthy=true
                break
              fi
              sleep 3
            done
            if [ "$healthy" != "true" ]; then
              echo "❌ Healthcheck falhou; iniciando rollback"
              docker logs --tail 100 ecomed-web || true
              docker stop ecomed-web || true
              docker rm ecomed-web || true
              docker run -d \
                --name ecomed-web \
                --restart unless-stopped \
                --network ia_default \
                -p 3010:3010 \
                --env-file /opt/ecomed/.env \
                ecomed-app:previous
              exit 1
            fi
            docker image tag "ecomed-app:${{ github.sha }}" ecomed-app:current

            echo "✅ Deploy concluído!"
            docker ps --filter name=ecomed-web
